name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: virasaat-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: virasaat-server/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  test-mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Virasat-MobileApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Virasat-MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    needs: [test, test-mobile]
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

              set -e

              cd /opt/VirasaatServer/Virasaat

              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main

              cd virasaat-server

              echo "Building containers..."
              docker compose build

              echo "Starting database..."
              docker compose up -d postgres

              echo "Running migrations..."
              docker compose run --rm api npm run db:migrate:prd21 || true
              docker compose run --rm api npm run db:migrate:subscriptions || true

              echo "Deploying API..."
              docker compose up -d

              echo "Cleaning old Docker images..."
              docker image prune -f

              echo "Checking health..."
              sleep 5

              curl --fail \
                http://localhost:3000/health

              echo "Deployment successful"

          EOF