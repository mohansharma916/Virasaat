name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: virasat-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: virasat-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  test-mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Virasat-MobileApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Virasat-MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security regression tests
        run: npm run test:security

      - name: Release configuration
        run: npm run release:check

  test-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner

  deploy:
    needs: [test, test-mobile, test-website, secret-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          # Pin the server's host key so a spoofed host cannot receive the
          # deploy session. Generate the value once with: ssh-keyscan -H <host>
          if [ -n "${{ secrets.SERVER_SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SERVER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "::warning::SERVER_SSH_KNOWN_HOSTS is not set; trusting the host key on first use."
            ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

              set -e

              # The live checkout on the server (/home/<SERVER_USER>/Virasaat).
              cd ~/Virasaat

              echo "Checking out tested code..."
              git fetch origin
              git reset --hard "${{ github.sha }}"

              cd virasat-server

              echo "Freeing disk space..."
              # Build cache and unused images are never removed otherwise and
              # fill the disk over repeated deploys. Volumes are never pruned:
              # postgres_data holds the database.
              docker builder prune -af
              docker image prune -af
              df -h /

              echo "Building containers..."
              docker compose build

              echo "Starting database..."
              docker compose up -d postgres

              echo "Running migrations..."
              docker compose run --rm api npm run db:migrate:prd21
              docker compose run --rm api npm run db:migrate:subscriptions
              docker compose run --rm api npm run db:migrate:auth-security
              docker compose run --rm api npm run db:migrate:vault-check-in
              docker compose run --rm api npm run db:migrate:security-review
              docker compose run --rm api npm run db:migrate:thumbnails
              docker compose run --rm api npm run db:migrate:plans-and-channels
              docker compose run --rm api npm run db:migrate:encrypt-titles

              echo "Deploying API..."
              docker compose up -d

              echo "Cleaning old Docker images and build cache..."
              docker image prune -af
              docker builder prune -af

              echo "Checking health..."
              sleep 5

              docker compose exec -T api node -e 'fetch("http://127.0.0.1:" + (process.env.PORT || "3000") + "/health", { signal: AbortSignal.timeout(5000) }).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));'

              echo "Deployment successful"

          EOF
