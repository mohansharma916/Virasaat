<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virasat — Email Templates Preview Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-forest: #0B5D4B;
      --deep-forest: #063F34;
      --warm-ivory: #F8F5EA;
      --mint: #EAF4F0;
      --sage: #DCEBE5;
      --border: #D7E1DD;
      --text-primary: #14231F;
      --text-secondary: #52615D;
      --text-muted: #7A8783;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #063F34;
      color: #FFFFFF;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #063F34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .crest {
      width: 38px;
      height: 38px;
      background: #0B5D4B;
      border: 1px solid rgba(197, 155, 39, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 20px;
      color: #FFFFFF;
    }
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
    }
    .brand-sub {
      font-size: 10px;
      letter-spacing: 1px;
      color: #DCEBE5;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .device-btn.active {
      background: #0B5D4B;
      border-color: #35B86B;
    }
    .device-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .main {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      background: #08493D;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      padding: 16px 20px 8px 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #DCEBE5;
      text-transform: uppercase;
    }
    .template-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      gap: 10px;
    }
    .template-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .template-item.active {
      background: #0B5D4B;
      border-left: 4px solid #35B86B;
    }
    .template-num {
      font-size: 11px;
      font-weight: 700;
      color: #35B86B;
      min-width: 20px;
      padding-top: 2px;
    }
    .template-info {
      flex: 1;
    }
    .template-name {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 2px;
    }
    .template-subject {
      font-size: 11px;
      color: #DCEBE5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }
    .preview-pane {
      flex: 1;
      background: #EAE6D8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .info-bar {
      background: #FFFFFF;
      border-bottom: 1px solid #D7E1DD;
      padding: 10px 24px;
      color: #14231F;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .info-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .info-subject-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7A8783;
    }
    .info-subject {
      font-size: 14px;
      font-weight: 600;
      color: #063F34;
    }
    .info-actions {
      display: flex;
      gap: 8px;
    }
    .action-link {
      font-size: 12px;
      color: #0B5D4B;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #D7E1DD;
      border-radius: 6px;
      background: #FAFBFB;
    }
    .action-link:hover {
      background: #EAF4F0;
    }
    .iframe-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 24px;
      background: #EAE6D8;
    }
    iframe {
      border: 0;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      background: #FFFFFF;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="crest">V</div>
      <div>
        <div class="brand-title">VIRASAT</div>
        <div class="brand-sub">Official Email Template Catalog</div>
      </div>
    </div>
    <div class="controls">
      <span style="font-size: 12px; color: #DCEBE5; margin-right: 8px;">Viewport:</span>
      <button class="device-btn active" onclick="setViewport('100%', this)">Desktop (Full)</button>
      <button class="device-btn" onclick="setViewport('640px', this)">Tablet / 640px</button>
      <button class="device-btn" onclick="setViewport('375px', this)">Mobile / 375px</button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-title">Templates (11)</div>
      <div id="template-list"></div>
    </div>

    <div class="preview-pane">
      <div class="info-bar">
        <div class="info-meta">
          <div class="info-subject-label">Email Subject Line</div>
          <div class="info-subject" id="current-subject">Loading...</div>
        </div>
        <div class="info-actions">
          <a id="open-new-tab" class="action-link" href="#" target="_blank">&#8599; Open Raw HTML</a>
          <a id="open-text" class="action-link" href="#" target="_blank">&#9776; Plain Text</a>
        </div>
      </div>
      <div class="iframe-wrapper">
        <iframe id="preview-frame" width="100%" height="95%"></iframe>
      </div>
    </div>
  </div>

  <script>
    const templates = [
  {
    "id": "OTP_VERIFICATION",
    "number": "01",
    "title": "OTP Verification (Signup & Security)",
    "subject": "849201 is your Virasat verification code",
    "htmlFile": "01-otp-verification.html",
    "txtFile": "01-otp-verification.txt"
  },
  {
    "id": "WELCOME",
    "number": "02",
    "title": "Welcome to Virasat (After Signup)",
    "subject": "Welcome to Virasat — Safeguarding your digital legacy",
    "htmlFile": "02-welcome.html",
    "txtFile": "02-welcome.txt"
  },
  {
    "id": "CHECK_IN_REMINDER",
    "number": "03",
    "title": "Check-In Routine Reminder",
    "subject": "[Illustrative sample — workflow unavailable] Reminder: Your Virasat check-in is due in 3 days",
    "htmlFile": "03-check-in-reminder.html",
    "txtFile": "03-check-in-reminder.txt"
  },
  {
    "id": "CHECK_IN_MISSED",
    "number": "04",
    "title": "Check-In Missed (Grace Period Alert)",
    "subject": "[Illustrative sample — workflow unavailable] URGENT: Missed Check-in on Virasat — Grace Period Active",
    "htmlFile": "04-check-in-missed.html",
    "txtFile": "04-check-in-missed.txt"
  },
  {
    "id": "CHECK_IN_CONFIRMED",
    "number": "05",
    "title": "Check-In Confirmed Success",
    "subject": "Check-in Confirmed — Your Virasat Vault is Secure",
    "htmlFile": "05-check-in-confirmed.html",
    "txtFile": "05-check-in-confirmed.txt"
  },
  {
    "id": "TRUSTED_PERSON_INVITATION",
    "number": "06",
    "title": "Trusted Contact / Nominee Invitation",
    "subject": "[Illustrative sample — workflow unavailable] Mohan Sharma has designated you as a Trusted Contact on Virasat",
    "htmlFile": "06-trusted-person-invitation.html",
    "txtFile": "06-trusted-person-invitation.txt"
  },
  {
    "id": "RELEASE_CASE_OPENED",
    "number": "07",
    "title": "Release Case Opened (Verifier Notice)",
    "subject": "[Illustrative sample — workflow unavailable] Confidential: Verification Case #VRS-CASE-2026-9041 opened for Mohan Sharma",
    "htmlFile": "07-release-case-opened.html",
    "txtFile": "07-release-case-opened.txt"
  },
  {
    "id": "RELEASE_AUTHORIZED",
    "number": "08",
    "title": "Release Authorized (Legacy Delivery)",
    "subject": "[Illustrative sample — workflow unavailable] A Legacy Message & Package has been released to you from Mohan Sharma",
    "htmlFile": "08-release-authorized.html",
    "txtFile": "08-release-authorized.txt"
  },
  {
    "id": "PASSWORD_RESET",
    "number": "09",
    "title": "Password Reset Code & Link",
    "subject": "Reset your Virasat account password",
    "htmlFile": "09-password-reset.html",
    "txtFile": "09-password-reset.txt"
  },
  {
    "id": "SECURITY_ALERT",
    "number": "10",
    "title": "Account Security Sentinel Alert",
    "subject": "Security Alert: New sign-in from unrecognized device on your Virasat account",
    "htmlFile": "10-security-alert.html",
    "txtFile": "10-security-alert.txt"
  },
  {
    "id": "SUBSCRIPTION_RECEIPT",
    "number": "11",
    "title": "Subscription Upgrade & Receipt",
    "subject": "[Illustrative sample — workflow unavailable] Your Virasat Family (illustrative) Subscription Confirmation",
    "htmlFile": "11-subscription-receipt.html",
    "txtFile": "11-subscription-receipt.txt"
  }
];
    let activeIndex = 0;

    function renderList() {
      const list = document.getElementById('template-list');
      list.innerHTML = '';
      templates.forEach((t, index) => {
        const item = document.createElement('div');
        item.className = 'template-item' + (index === activeIndex ? ' active' : '');
        item.onclick = () => selectTemplate(index);
        item.innerHTML = `
          <div class="template-num">${t.number}</div>
          <div class="template-info">
            <div class="template-name">${t.title}</div>
            <div class="template-subject">${t.subject}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function selectTemplate(index) {
      activeIndex = index;
      renderList();
      const t = templates[index];
      document.getElementById('current-subject').innerText = t.subject;
      document.getElementById('open-new-tab').href = t.htmlFile;
      document.getElementById('open-text').href = t.txtFile;
      const iframe = document.getElementById('preview-frame');
      iframe.src = t.htmlFile;
    }

    function setViewport(width, btn) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const iframe = document.getElementById('preview-frame');
      iframe.style.width = width;
      if (width === '375px') {
        iframe.style.borderRadius = '24px';
        iframe.style.border = '8px solid #222222';
      } else {
        iframe.style.borderRadius = '8px';
        iframe.style.border = '0';
      }
    }

    // Init
    renderList();
    selectTemplate(0);
  </script>
</body>
</html>
