services:
  postgres:
    image: postgres:16-alpine
    container_name: virasat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
      POSTGRES_DB: ${DB_DATABASE:-virasat}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-virasat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virasat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - PORT=${PORT:-3000}
      - DB_PORT=5432
      - DB_SYNCHRONIZE=false
    # Reachable only through the host's reverse proxy. Exposing the port
    # publicly would bypass TLS and let callers spoof X-Forwarded-For.
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    # A fixed name keeps the same database whatever folder or project name
    # compose runs under. Set POSTGRES_VOLUME in .env to reuse an existing one.
    name: ${POSTGRES_VOLUME:-virasat-server_postgres_data}
